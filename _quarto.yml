lang: en

project:
  title: "Peekbank"
  type: website
  render:
    - "*.qmd"
    - "!repos/"
    - "!migration/"
  resources:
    - "slices/**"
    - "images/**"

website:
  favicon: images/favicon-32x32.png
  navbar:
    logo: images/raccoon.png
    logo-alt: "Peekbank raccoon logo"
    title: Peekbank
    left:
      - text: Analyses
        menu:
          - href: accuracy.qmd
            text: Accuracy Explorer
          - href: rt.qmd
            text: Reaction Time Explorer
          - href: longitudinal.qmd
            text: Longitudinal Explorer
          - href: cdi.qmd
            text: CDI Relationships
          - href: items.qmd
            text: Items Explorer
          - href: reliability.qmd
            text: Reliability Explorer
      - href: datasets.qmd
        text: Datasets
      - href: dataaccess.qmd
        text: Data Access
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/peekbank
        aria-label: GitHub
  page-footer:
    center: |
      Peekbank is an open database of developmental eye-tracking data.
      [Data access](dataaccess.html) ·
      [GitHub](https://github.com/peekbank) ·
      [How to cite](dataaccess.html#citation)

format:
  datapage-html:
    theme: theme.scss
    mainfont: "ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif"
    fontsize: 15px

execute:
  echo: false
  message: false
  warning: false
  error: false
